<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZR.DOMA - Portable Edition</title>
    <!-- Tailwind CSS 4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                mono: ['JetBrains Mono', 'monospace'],
              },
            }
          }
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        @theme {
            --color-primary: #8A2BE2;
            --color-secondary: #00F2FE;
            --color-bg: #0B0C10;
        }

        body {
            @apply bg-[#0B0C10] text-[#E0E0E0] overflow-hidden;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            @apply backdrop-blur-2xl bg-white/[0.03] border border-white/10 rounded-[32px] transition-all;
        }

        .neon-text {
            text-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        .animate-pulse-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
        }
    </style>
    <!-- CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Data ---
        const translations = {
            en: {
                appName: "ZR.DOMA",
                appTagline: "Advanced Nursing System",
                dashboard: "Dashboard",
                operator: "Operator",
                init: "Initialize Connection",
                perf: "Performance Overview",
                initializeExam: "INITIALIZE EXAM",
            },
            ar: {
                appName: "ZR.DOMA",
                appTagline: "نظام التمريض المتقدم",
                dashboard: "لوحة القيادة",
                operator: "المشغل",
                init: "بدء الاتصال",
                perf: "نظرة عامة على الأداء",
                initializeExam: "بدء الاختبار",
            }
        };

        const questions = [
            {
                id: 1,
                text: "ما هو الإجراء الأول عند اكتشاف مريض يعاني من صدمة استهدافية (Anaphylaxis)؟",
                options: ["إعطاء الأكسجين", "حقن الإيبينفرين فوراً", "استدعاء الطبيب", "قياس ضغط الدم"],
                correct: "حقن الإيبينفرين فوراً"
            }
        ];

        // --- Icons Helper ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // --- Components ---
        const Button = ({ children, onClick, className = "" }) => (
            <motion.button 
                whileHover={{ scale: 1.02 }}
                whileTap={{ scale: 0.98 }}
                onClick={onClick}
                className={`py-3 px-8 rounded-xl font-bold uppercase tracking-widest transition-all ${className}`}
            >
                {children}
            </motion.button>
        );

        // --- Pages ---
        const LoginPage = ({ onLogin, t, lang }) => {
            const [name, setName] = useState('');
            return (
                <div className="h-screen flex items-center justify-center p-6 relative">
                    <div className="absolute inset-0 z-0 overflow-hidden">
                        <div className="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#8A2BE2]/10 blur-[120px] rounded-full animate-pulse-slow"></div>
                    </div>
                    <motion.div 
                        initial={{ opacity: 0, y: 20 }}
                        animate={{ opacity: 1, y: 0 }}
                        className="glass-card w-full max-w-md p-10 z-10"
                    >
                        <div className="text-center mb-10">
                            <h1 className="text-6xl font-black bg-gradient-to-r from-[#8A2BE2] to-[#00F2FE] bg-clip-text text-transparent drop-shadow-xl tracking-tighter">
                                {t.appName}
                            </h1>
                            <p className="text-[10px] text-white/30 uppercase tracking-[0.4em] mt-3 font-bold">{t.appTagline}</p>
                        </div>
                        <div className="space-y-6">
                            <div>
                                <label className="block text-[10px] font-bold text-white/40 mb-2 uppercase tracking-widest">{t.operator}</label>
                                <input 
                                    className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 outline-none focus:border-white/30"
                                    placeholder="Operational Code"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                />
                            </div>
                            <Button 
                                onClick={() => onLogin(name)}
                                className="w-full bg-gradient-to-r from-[#8A2BE2] to-[#6a21ad] text-white"
                            >
                                {t.init}
                            </Button>
                        </div>
                    </motion.div>
                </div>
            );
        };

        const Dashboard = ({ user, t, lang, onStart }) => {
            return (
                <div className="h-screen flex flex-col md:flex-row overflow-hidden bg-[#0B0C10]">
                    {/* Sidebar */}
                    <aside className="w-full md:w-72 bg-white/[0.02] border-l md:border-l-0 md:border-r border-white/10 p-8 flex flex-col shrink-0">
                        <h1 className="text-3xl font-black bg-gradient-to-r from-[#8A2BE2] to-[#00F2FE] bg-clip-text text-transparent">{t.appName}</h1>
                        <nav className="mt-12 space-y-2 flex-1">
                            <div className="flex items-center gap-4 p-4 bg-white/5 border border-white/10 rounded-2xl">
                                <Icon name="layout-dashboard" className="text-primary" />
                                <span className="font-bold">{t.dashboard}</span>
                            </div>
                        </nav>
                        <div className="mt-auto border-t border-white/10 pt-6">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center font-bold">{user[0]}</div>
                                <div className="min-w-0">
                                    <p className="font-bold truncate text-sm">{user}</p>
                                    <p className="text-[10px] text-white/40 font-mono">NODE v2.4</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 p-6 md:p-12 overflow-y-auto">
                        <header className="flex justify-between items-end mb-12">
                            <div>
                                <h2 className="text-4xl font-light text-white">{t.perf.split(' ')[0]} <span className="font-bold">{t.perf.split(' ')[1]}</span></h2>
                                <p className="text-white/40 uppercase tracking-[0.2em] text-[10px] mt-2">Global Competency Synchronization Active</p>
                            </div>
                            <Button onClick={onStart} className="bg-gradient-to-r from-[#8A2BE2] to-[#6a21ad] text-xs">
                                {t.initializeExam}
                            </Button>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-8">
                            <div className="md:col-span-8 glass-card min-h-[400px] flex items-center justify-center relative overflow-hidden p-12">
                                <div className="absolute w-[300px] h-[300px] bg-[#8A2BE2]/10 blur-[80px] rounded-full"></div>
                                <div className="text-center z-10 transition-all">
                                    <p className="text-[10px] text-[#00F2FE] uppercase tracking-[0.5em] mb-4 font-black">Skill Mastery</p>
                                    <h3 className="text-9xl font-mono font-black tabular-nums">0<span className="text-3xl opacity-30">%</span></h3>
                                </div>
                            </div>
                            <div className="md:col-span-4 space-y-4">
                                {[1,2,3,4,5].map(i => (
                                    <div key={i} className="p-5 glass-card flex items-center gap-4 opacity-50 grayscale">
                                        <div className="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center">0{i}</div>
                                        <div className="flex-1">
                                            <p className="text-xs font-bold uppercase">System Module {i}</p>
                                            <p className="text-[9px] text-white/40 tracking-widest mt-1">LOCKED</p>
                                        </div>
                                        <Icon name="lock" size={14} className="text-white/20" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // --- Root App ---
        const App = () => {
            const [lang, setLang] = useState('ar');
            const [page, setPage] = useState('login');
            const [user, setUser] = useState(null);
            const t = translations[lang];

            useEffect(() => {
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);

            const handleLogin = (name) => {
                setUser(name || 'OPERATOR');
                setPage('dashboard');
            };

            return (
                <div className="min-h-screen">
                    <AnimatePresence mode="wait">
                        {page === 'login' && <LoginPage key="login" onLogin={handleLogin} t={t} lang={lang} />}
                        {page === 'dashboard' && <Dashboard key="dash" user={user} t={t} lang={lang} onStart={() => alert('Exam System Initializing...')} />}
                    </AnimatePresence>
                    
                    {/* Language Toggle */}
                    <div className="fixed bottom-6 right-6 z-[100] flex gap-2">
                        <button 
                            className={`p-2 rounded-lg text-[10px] font-bold ${lang === 'ar' ? 'bg-primary text-white' : 'bg-white/5 text-white/40'}`}
                            onClick={() => setLang('ar')}
                        >AR</button>
                        <button 
                            className={`p-2 rounded-lg text-[10px] font-bold ${lang === 'en' ? 'bg-primary text-white' : 'bg-white/5 text-white/40'}`}
                            onClick={() => setLang('en')}
                        >EN</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
